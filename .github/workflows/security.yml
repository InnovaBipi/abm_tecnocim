name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow gitleaks to read the full history and post results.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits on push events.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Non-blocking: report high-severity advisories without failing the run,
      # so a transitive advisory never blocks a production deploy.
      - name: Audit server dependencies
        working-directory: server
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Audit client dependencies
        working-directory: client
        continue-on-error: true
        run: npm audit --audit-level=high
