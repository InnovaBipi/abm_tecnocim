name: abm-tecnocim
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /

services:
  - name: api
    github:
      repo: DATANINJA-dev/abm_tecnocim
      branch: main
      deploy_on_push: true
    source_dir: server
    build_command: npm install && npm run build
    run_command: npm start
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: "${abm-tecnocim-db.HOSTNAME}"
      - key: DB_PORT
        value: "${abm-tecnocim-db.PORT}"
      - key: DB_USER
        value: "${abm-tecnocim-db.USERNAME}"
      - key: DB_PASS
        value: "${abm-tecnocim-db.PASSWORD}"
      - key: DB_NAME
        value: "${abm-tecnocim-db.DATABASE}"
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        type: SECRET
        value: REPLACE_ME_WITH_STRONG_SECRET
      - key: GEMINI_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: PERPLEXITY_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: FIRECRAWL_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: RESEND_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: RESEND_WEBHOOK_SECRET
        type: SECRET
        value: REPLACE_ME
      - key: FRONTEND_URL
        value: "${APP_URL}"
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10

static_sites:
  - name: web
    github:
      repo: DATANINJA-dev/abm_tecnocim
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm install && npm run build
    output_dir: dist
    catchall_document: index.html

databases:
  - cluster_name: abm-tecnocim-db
    engine: MYSQL
    name: abm-tecnocim-db
    production: true
