name: abm-tecnocim
region: lon

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: abm.tecnociminnova.com
    type: PRIMARY

services:
  - name: api
    github:
      repo: InnovaBipi/abm_tecnocim
      branch: main
      deploy_on_push: true
    source_dir: server
    build_command: npm install --include=dev && npm run build && cp -r ../database ./database
    run_command: npm start
    environment_slug: node-js
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: "${abm-tecnocim-db.HOSTNAME}"
      - key: DB_PORT
        value: "${abm-tecnocim-db.PORT}"
      - key: DB_USER
        value: "${abm-tecnocim-db.USERNAME}"
      - key: DB_PASS
        value: "${abm-tecnocim-db.PASSWORD}"
      - key: DB_NAME
        value: abm_tecnocim
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        type: SECRET
        value: REPLACE_ME_WITH_STRONG_SECRET
      - key: GEMINI_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: PERPLEXITY_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: FIRECRAWL_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: RESEND_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: RESEND_WEBHOOK_SECRET
        type: SECRET
        value: REPLACE_ME
      - key: FRONTEND_URL
        value: "https://abm.tecnociminnova.com"
      - key: VITE_API_URL
        value: "/api"
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
    routes:
      - path: /api
        preserve_path_prefix: true
      # OAuth 2.1 for the MCP server (root-level endpoints must reach the API service, not the SPA)
      - path: /.well-known
        preserve_path_prefix: true
      - path: /authorize
        preserve_path_prefix: true
      - path: /token
        preserve_path_prefix: true
      - path: /register
        preserve_path_prefix: true
      - path: /revoke
        preserve_path_prefix: true
      - path: /oauth
        preserve_path_prefix: true

static_sites:
  - name: web
    github:
      repo: InnovaBipi/abm_tecnocim
      branch: main
      deploy_on_push: true
    source_dir: client
    build_command: npm install --include=dev && npm run build
    output_dir: dist
    routes:
      - path: /
    catchall_document: index.html

databases:
  - cluster_name: abm-tecnocim-db
    engine: MYSQL
    name: abm-tecnocim-db
    production: true
